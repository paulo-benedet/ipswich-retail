name: Django CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://retail:ci-only-password@localhost:5432/retail

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated tests
        run: python manage.py test --verbosity 2

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Test password toggle and login in Chromium
        run: python manage.py test accounts.e2e --verbosity 2

  docker:
    name: Build and test Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Build image
        run: docker compose build
      - name: Test application inside container
        run: docker compose run --rm web python manage.py test --verbosity 2
      - name: Prepare database
        run: docker compose run --rm web python manage.py migrate --noinput
      - name: Start application and check HTTP response
        run: |
          docker compose up -d
          curl --fail --show-error --silent \
            --retry 15 --retry-all-errors --retry-delay 2 \
            --connect-timeout 5 --max-time 10 \
            --output /dev/null \
            http://127.0.0.1:8000/
      - name: Show logs and clean up
        if: always()
        run: |
          docker compose logs
          docker compose down --volumes

  deploy:
    name: Deploy tested main revision
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      APP_URL: ${{ vars.APP_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      MONITORING_TOKEN: ${{ secrets.MONITORING_TOKEN }}
      EXPECTED_REVISION: ${{ github.sha }}
      CHECK_ATTEMPTS: "40"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Trigger deployment of the tested commit
        run: python scripts/deploy.py
      - name: Verify deployed revision, database availability and resource metrics
        run: python scripts/check_service.py
